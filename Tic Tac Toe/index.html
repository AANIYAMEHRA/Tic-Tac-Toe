<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Tic Tac Toe</h1>
      <p class="tagline">You are X · The computer is O</p>
    </header>

    <section class="scoreboard" aria-label="Scoreboard">
      <div class="stat">
        <span class="stat-label">You</span>
        <span class="stat-value" id="playerScore">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Computer</span>
        <span class="stat-value" id="computerScore">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Draws</span>
        <span class="stat-value" id="drawScore">0</span>
      </div>
      <div class="stat streak" id="streakBox" title="Current win streak">
        <span class="stat-label">Streak</span>
        <span class="stat-value" id="streakScore">0</span>
      </div>
    </section>

    <div class="status" id="status" role="status" aria-live="polite"></div>

    <section class="board" id="board" aria-label="Tic tac toe board"></section>

    <div class="actions">
      <button class="btn btn-primary" id="nextBtn" type="button" disabled>Next round</button>
      <button class="btn" id="cancelBtn" type="button">Cancel round</button>
      <button class="btn btn-danger" id="resetScoreBtn" type="button">Reset score</button>
    </div>

    <p class="hint">Keys <kbd>1</kbd>–<kbd>9</kbd> to play · <kbd>Enter</kbd> next round · <kbd>Esc</kbd> cancel</p>

    <div class="history-title">Recent rounds</div>
    <div class="history" id="history"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
